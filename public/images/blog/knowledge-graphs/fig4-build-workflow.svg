<svg xmlns="http://www.w3.org/2000/svg" width="680" height="330" viewBox="0 0 680 330" role="img"
     font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>Build workflow for the ad semantic model</title>
<desc>Seven stages from picking a narrow domain through interviews, ontology, mappings, shapes in CI, deciding what to load, and ongoing stewardship.</desc>

<rect x="0" y="0" width="680" height="330" rx="8" fill="#15120F"/>

<defs>
  <marker id="kg4arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#6A6357" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<!-- accent = the semantic decisions; plain = the mechanical steps -->
<g>
  <rect x="40" y="34" width="185" height="62" rx="8" fill="#1F1B16" stroke="rgba(237,231,218,0.22)"/>
  <text x="132" y="59" text-anchor="middle" font-size="13.5" font-weight="600" fill="#EDE7DA">A. Narrow the scope</text>
  <text x="132" y="79" text-anchor="middle" font-size="12" fill="#A39B8C">paid media only</text>
</g>
<g>
  <rect x="247" y="34" width="185" height="62" rx="8" fill="rgba(198,249,78,0.09)" stroke="#C6F94E"/>
  <text x="340" y="59" text-anchor="middle" font-size="13.5" font-weight="600" fill="#C6F94E">B. Interview people</text>
  <text x="340" y="79" text-anchor="middle" font-size="12" fill="#EDE7DA">what counts as attributed</text>
</g>
<g>
  <rect x="455" y="34" width="185" height="62" rx="8" fill="rgba(198,249,78,0.09)" stroke="#C6F94E"/>
  <text x="547" y="59" text-anchor="middle" font-size="13.5" font-weight="600" fill="#C6F94E">C. Write the ontology</text>
  <text x="547" y="79" text-anchor="middle" font-size="12" fill="#EDE7DA">classes, hierarchy, rules</text>
</g>
<g>
  <rect x="455" y="150" width="185" height="62" rx="8" fill="#1A1714" stroke="rgba(237,231,218,0.16)"/>
  <text x="547" y="175" text-anchor="middle" font-size="13.5" font-weight="600" fill="#EDE7DA">D. Write the mappings</text>
  <text x="547" y="195" text-anchor="middle" font-size="12" fill="#A39B8C">R2RML to ad tables</text>
</g>
<g>
  <rect x="247" y="150" width="185" height="62" rx="8" fill="#1A1714" stroke="rgba(237,231,218,0.16)"/>
  <text x="340" y="175" text-anchor="middle" font-size="13.5" font-weight="600" fill="#EDE7DA">E. Shapes in CI</text>
  <text x="340" y="195" text-anchor="middle" font-size="12" fill="#A39B8C">SHACL on every ingest</text>
</g>
<g>
  <rect x="40" y="150" width="185" height="62" rx="8" fill="#1A1714" stroke="rgba(237,231,218,0.16)"/>
  <text x="132" y="175" text-anchor="middle" font-size="13.5" font-weight="600" fill="#EDE7DA">F. Decide what loads</text>
  <text x="132" y="195" text-anchor="middle" font-size="12" fill="#A39B8C">meaning, not ad rows</text>
</g>
<g>
  <rect x="40" y="250" width="185" height="62" rx="8" fill="rgba(198,249,78,0.09)" stroke="#C6F94E"/>
  <text x="132" y="275" text-anchor="middle" font-size="13.5" font-weight="600" fill="#C6F94E">G. Steward it</text>
  <text x="132" y="295" text-anchor="middle" font-size="12" fill="#EDE7DA">named owner, versioned</text>
</g>

<g stroke="#6A6357" stroke-width="1.5" fill="none" marker-end="url(#kg4arrow)">
  <line x1="225" y1="65" x2="243" y2="65"/>
  <line x1="432" y1="65" x2="451" y2="65"/>
  <line x1="547" y1="96" x2="547" y2="146"/>
  <line x1="455" y1="181" x2="436" y2="181"/>
  <line x1="247" y1="181" x2="229" y2="181"/>
  <line x1="132" y1="212" x2="132" y2="246"/>
  <path d="M225 281 L340 281 L340 216" stroke-dasharray="4 4"/>
</g>

<text x="352" y="253" font-size="12" fill="#A39B8C">definitions change; loop back</text>
</svg>
