<svg xmlns="http://www.w3.org/2000/svg" width="680" height="340" viewBox="0 0 680 340" role="img"
     font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>The two outputs of n8n's Loop Over Items node</title>
<desc>Items enter a Loop Over Items node. Output 1 sends one batch at a time to the classifier and back again; output 0 fires once, after everything is finished.</desc>

<rect x="0" y="0" width="680" height="340" rx="8" fill="#15120F"/>

<defs>
  <marker id="n1arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#6A6357" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<g>
  <rect x="30" y="160" width="150" height="58" rx="8" fill="#1F1B16" stroke="rgba(237,231,218,0.22)"/>
  <text x="105" y="184" text-anchor="middle" font-size="14" font-weight="600" fill="#EDE7DA">100 reviews</text>
  <text x="105" y="203" text-anchor="middle" font-size="12" fill="#A39B8C">arrive as items</text>
</g>

<g>
  <rect x="232" y="150" width="176" height="78" rx="8" fill="rgba(198,249,78,0.09)" stroke="#C6F94E"/>
  <text x="320" y="179" text-anchor="middle" font-size="14" font-weight="600" fill="#C6F94E">Loop Over Items</text>
  <text x="320" y="198" text-anchor="middle" font-size="12" fill="#EDE7DA">(Split In Batches)</text>
  <text x="320" y="216" text-anchor="middle" font-size="11" fill="#A39B8C">two outputs</text>
</g>

<g>
  <rect x="460" y="60" width="190" height="50" rx="8" fill="#1A1714" stroke="rgba(237,231,218,0.16)"/>
  <text x="555" y="81" text-anchor="middle" font-size="14" font-weight="600" fill="#EDE7DA">Gemini classifies</text>
  <text x="555" y="99" text-anchor="middle" font-size="12" fill="#A39B8C">this batch</text>
</g>
<g>
  <rect x="460" y="136" width="190" height="46" rx="8" fill="#1A1714" stroke="rgba(237,231,218,0.16)"/>
  <text x="555" y="164" text-anchor="middle" font-size="14" font-weight="600" fill="#EDE7DA">parse + validate</text>
</g>

<g>
  <rect x="436" y="240" width="214" height="58" rx="8" fill="#1A1714" stroke="rgba(237,231,218,0.16)"/>
  <text x="543" y="264" text-anchor="middle" font-size="14" font-weight="600" fill="#EDE7DA">build rows → dedup</text>
  <text x="543" y="283" text-anchor="middle" font-size="12" fill="#A39B8C">→ insert</text>
</g>

<g stroke="#6A6357" stroke-width="1.5" fill="none" marker-end="url(#n1arrow)">
  <line x1="180" y1="189" x2="228" y2="189"/>
  <path d="M408 175 L430 175 L430 85 L456 85"/>
  <line x1="555" y1="110" x2="555" y2="132"/>
  <path d="M460 159 L444 159 L444 205 L412 205" stroke-dasharray="4 4"/>
  <path d="M320 228 L320 269 L432 269"/>
</g>

<text x="424" y="112" text-anchor="end" font-size="12" font-weight="600" fill="#C6F94E">output 1 · loop</text>
<text x="424" y="129" text-anchor="end" font-size="11.5" fill="#A39B8C">one batch at a time</text>
<text x="462" y="212" font-size="11.5" fill="#A39B8C">back into the loop</text>
<text x="308" y="252" text-anchor="end" font-size="12" font-weight="600" fill="#C6F94E">output 0 · done</text>
<text x="308" y="269" text-anchor="end" font-size="11.5" fill="#A39B8C">everything, once</text>
<text x="308" y="286" text-anchor="end" font-size="11.5" fill="#A39B8C">the loop has finished</text>

<line x1="30" y1="308" x2="650" y2="308" stroke="rgba(237,231,218,0.12)"/>
<text x="30" y="329" font-size="12" fill="#A39B8C">Output 0 is the finished one, not the first thing that happens. Drag from the wrong line and items circle forever.</text>
</svg>
