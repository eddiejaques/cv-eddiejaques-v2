<svg xmlns="http://www.w3.org/2000/svg" width="680" height="330" viewBox="0 0 680 330" role="img"
     font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>Cursor pagination in the backfill workflow</title>
<desc>A backfill config sets a start date, a POST fetches one page at a time using a cursor, and the loop continues while the response reports more pages. The built-in pagination never advanced the cursor.</desc>

<rect x="0" y="0" width="680" height="330" rx="8" fill="#15120F"/>

<defs>
  <marker id="n4arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#6A6357" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <marker id="n4red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#D9603F" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<g>
  <rect x="28" y="44" width="150" height="58" rx="8" fill="#1F1B16" stroke="rgba(237,231,218,0.22)"/>
  <text x="103" y="68" text-anchor="middle" font-size="13.5" font-weight="600" fill="#EDE7DA">Backfill config</text>
  <text x="103" y="87" text-anchor="middle" font-size="12" fill="#A39B8C">since = now − N days</text>
</g>
<g>
  <rect x="230" y="44" width="180" height="58" rx="8" fill="#1A1714" stroke="rgba(237,231,218,0.16)"/>
  <text x="320" y="68" text-anchor="middle" font-size="13.5" font-weight="600" fill="#EDE7DA">POST /feedbacks/filter</text>
  <text x="320" y="87" text-anchor="middle" font-size="12" fill="#A39B8C">?after = cursor</text>
</g>
<g>
  <rect x="462" y="44" width="180" height="58" rx="8" fill="#1A1714" stroke="rgba(237,231,218,0.16)"/>
  <text x="552" y="68" text-anchor="middle" font-size="13.5" font-weight="600" fill="#EDE7DA">collect this page</text>
  <text x="552" y="87" text-anchor="middle" font-size="12" fill="#A39B8C">guard stops at 500</text>
</g>
<g>
  <rect x="452" y="152" width="200" height="58" rx="8" fill="rgba(198,249,78,0.09)" stroke="#C6F94E"/>
  <text x="552" y="176" text-anchor="middle" font-size="13.5" font-weight="600" fill="#C6F94E">has_more and a cursor?</text>
  <text x="552" y="195" text-anchor="middle" font-size="12" fill="#EDE7DA">the one arrow n8n skipped</text>
</g>
<g>
  <rect x="28" y="152" width="240" height="58" rx="8" fill="#1F1B16" stroke="rgba(237,231,218,0.22)"/>
  <text x="148" y="176" text-anchor="middle" font-size="13.5" font-weight="600" fill="#EDE7DA">all items</text>
  <text x="148" y="195" text-anchor="middle" font-size="12" fill="#A39B8C">→ classify → dedup → insert</text>
</g>

<g stroke="#6A6357" stroke-width="1.5" fill="none" marker-end="url(#n4arrow)">
  <line x1="178" y1="73" x2="226" y2="73"/>
  <line x1="410" y1="73" x2="458" y2="73"/>
  <line x1="552" y1="102" x2="552" y2="148"/>
  <line x1="452" y1="181" x2="272" y2="181"/>
</g>

<path d="M452 168 L420 168 L420 116 L320 116 L320 106" stroke="#D9603F" stroke-width="1.6" fill="none" marker-end="url(#n4red)"/>
<text x="300" y="140" text-anchor="end" font-size="12" font-weight="600" fill="#D9603F">yes — advance the cursor</text>
<text x="300" y="205" text-anchor="middle" font-size="12" fill="#A39B8C">no</text>

<line x1="28" y1="252" x2="652" y2="252" stroke="rgba(237,231,218,0.12)"/>
<text x="28" y="274" font-size="12" fill="#A39B8C">n8n's built-in pagination did everything in this picture except the red arrow. It refetched page one, forever,</text>
<text x="28" y="292" font-size="12" fill="#A39B8C">and reported success — the worst kind of bug: no error, just quietly incomplete data.</text>
<text x="28" y="315" font-size="12" fill="#EDE7DA">Fifteen lines in a Code node replaced one node and left the rest of the canvas visual.</text>
</svg>
