<svg xmlns="http://www.w3.org/2000/svg" width="680" height="660" viewBox="0 0 680 660" role="img"
     font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>One branch, end to end</title>
<desc>A schedule signs a JWT, fetches reviews, flattens them, loops each batch through Gemini and a validation step, then builds hashed rows, checks which ids already exist, and inserts only the new ones.</desc>

<rect x="0" y="0" width="680" height="660" rx="8" fill="#15120F"/>

<defs>
  <marker id="n3arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#6A6357" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<!-- main spine -->
<g>
  <rect x="150" y="24" width="280" height="44" rx="8" fill="rgba(198,249,78,0.09)" stroke="#C6F94E"/>
  <text x="290" y="51" text-anchor="middle" font-size="13.5" font-weight="600" fill="#C6F94E">Schedule · daily</text>
</g>
<g>
  <rect x="150" y="90" width="280" height="46" rx="8" fill="#1A1714" stroke="rgba(237,231,218,0.16)"/>
  <text x="290" y="112" text-anchor="middle" font-size="13.5" font-weight="600" fill="#EDE7DA">Code · sign a JWT</text>
  <text x="290" y="128" text-anchor="middle" font-size="11.5" fill="#A39B8C">the first day's work</text>
</g>
<g>
  <rect x="150" y="158" width="280" height="44" rx="8" fill="#1A1714" stroke="rgba(237,231,218,0.16)"/>
  <text x="290" y="185" text-anchor="middle" font-size="13.5" fill="#EDE7DA">HTTP · fetch the latest reviews</text>
</g>
<g>
  <rect x="150" y="224" width="280" height="44" rx="8" fill="#1A1714" stroke="rgba(237,231,218,0.16)"/>
  <text x="290" y="251" text-anchor="middle" font-size="13.5" fill="#EDE7DA">Code · flatten to one item per review</text>
</g>
<g>
  <rect x="150" y="290" width="280" height="56" rx="8" fill="rgba(198,249,78,0.09)" stroke="#C6F94E"/>
  <text x="290" y="313" text-anchor="middle" font-size="13.5" font-weight="600" fill="#C6F94E">Loop Over Items</text>
  <text x="290" y="332" text-anchor="middle" font-size="11.5" fill="#EDE7DA">one batch out, everything back in</text>
</g>
<g>
  <rect x="150" y="392" width="280" height="46" rx="8" fill="#1A1714" stroke="rgba(237,231,218,0.16)"/>
  <text x="290" y="414" text-anchor="middle" font-size="13.5" font-weight="600" fill="#EDE7DA">Code · build the row</text>
  <text x="290" y="430" text-anchor="middle" font-size="11.5" fill="#A39B8C">stable hashed id · name thrown away</text>
</g>
<g>
  <rect x="150" y="460" width="280" height="44" rx="8" fill="#1A1714" stroke="rgba(237,231,218,0.16)"/>
  <text x="290" y="487" text-anchor="middle" font-size="13.5" fill="#EDE7DA">SQL · which ids do we already have?</text>
</g>
<g>
  <rect x="150" y="522" width="280" height="50" rx="8" fill="#1A1714" stroke="rgba(237,231,218,0.16)"/>
  <text x="290" y="544" text-anchor="middle" font-size="13.5" font-weight="600" fill="#EDE7DA">Code · keep only the new ones</text>
  <text x="290" y="561" text-anchor="middle" font-size="11.5" fill="#A39B8C">If · anything left?</text>
</g>
<g>
  <rect x="150" y="592" width="130" height="44" rx="8" fill="#1A1714" stroke="rgba(237,231,218,0.16)"/>
  <text x="215" y="619" text-anchor="middle" font-size="13.5" fill="#EDE7DA">Insert</text>
</g>
<g>
  <rect x="300" y="592" width="130" height="44" rx="8" fill="#1A1714" stroke="rgba(237,231,218,0.16)" stroke-dasharray="4 4"/>
  <text x="365" y="619" text-anchor="middle" font-size="13.5" fill="#A39B8C">nothing new · stop</text>
</g>

<!-- the loop leg -->
<g>
  <rect x="480" y="256" width="170" height="46" rx="8" fill="#1A1714" stroke="rgba(237,231,218,0.16)"/>
  <text x="565" y="278" text-anchor="middle" font-size="13.5" font-weight="600" fill="#EDE7DA">Gemini</text>
  <text x="565" y="294" text-anchor="middle" font-size="11.5" fill="#A39B8C">1 of 11 themes</text>
</g>
<g>
  <rect x="480" y="334" width="170" height="46" rx="8" fill="#1A1714" stroke="rgba(237,231,218,0.16)"/>
  <text x="565" y="356" text-anchor="middle" font-size="13.5" font-weight="600" fill="#EDE7DA">Code · check</text>
  <text x="565" y="372" text-anchor="middle" font-size="11.5" fill="#A39B8C">against the allow-list</text>
</g>

<!-- flow -->
<g stroke="#6A6357" stroke-width="1.5" fill="none" marker-end="url(#n3arrow)">
  <line x1="290" y1="68" x2="290" y2="86"/>
  <line x1="290" y1="136" x2="290" y2="154"/>
  <line x1="290" y1="202" x2="290" y2="220"/>
  <line x1="290" y1="268" x2="290" y2="286"/>
  <path d="M430 306 L455 306 L455 279 L476 279"/>
  <line x1="565" y1="302" x2="565" y2="330"/>
  <path d="M480 357 L455 357 L455 330 L434 330" stroke-dasharray="4 4"/>
  <line x1="290" y1="346" x2="290" y2="388"/>
  <line x1="290" y1="438" x2="290" y2="456"/>
  <line x1="290" y1="504" x2="290" y2="518"/>
  <path d="M215 572 L215 588"/>
  <path d="M365 572 L365 588"/>
</g>

<text x="298" y="368" font-size="12" fill="#C6F94E" font-weight="600">done</text>
<text x="470" y="238" font-size="12" fill="#C6F94E" font-weight="600">each batch</text>
<text x="452" y="404" font-size="11.5" fill="#A39B8C">back into the loop</text>
<text x="222" y="586" font-size="11.5" fill="#A39B8C">yes</text>
<text x="372" y="586" font-size="11.5" fill="#A39B8C">no</text>

<line x1="30" y1="646" x2="650" y2="646" stroke="rgba(237,231,218,0.12)"/>
</svg>
