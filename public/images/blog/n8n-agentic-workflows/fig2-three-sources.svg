<svg xmlns="http://www.w3.org/2000/svg" width="680" height="700" viewBox="0 0 680 700" role="img"
     font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>The daily workflow: one shape, three sources</title>
<desc>Two schedule triggers. The first runs the iOS branch and then, via an accidental dependency, the Android branch. The second runs the survey branch. All three follow the same fetch, classify, dedup, insert shape.</desc>

<rect x="0" y="0" width="680" height="700" rx="8" fill="#15120F"/>

<defs>
  <marker id="n2arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#6A6357" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <marker id="n2red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#D9603F" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<!-- ===== left column: iOS then Android ===== -->
<g>
  <rect x="30" y="26" width="270" height="44" rx="8" fill="rgba(198,249,78,0.09)" stroke="#C6F94E"/>
  <text x="165" y="53" text-anchor="middle" font-size="13.5" font-weight="600" fill="#C6F94E">Schedule · daily :20</text>
</g>
<g>
  <rect x="30" y="98" width="270" height="52" rx="8" fill="#1F1B16" stroke="rgba(237,231,218,0.22)"/>
  <text x="165" y="121" text-anchor="middle" font-size="13.5" font-weight="600" fill="#EDE7DA">iOS · App Store Connect</text>
  <text x="165" y="139" text-anchor="middle" font-size="12" fill="#A39B8C">ES256 JWT you sign yourself</text>
</g>
<g>
  <rect x="30" y="178" width="270" height="44" rx="8" fill="#1A1714" stroke="rgba(237,231,218,0.16)"/>
  <text x="165" y="205" text-anchor="middle" font-size="13.5" fill="#EDE7DA">classify + validate</text>
</g>
<g>
  <rect x="30" y="250" width="270" height="44" rx="8" fill="#1A1714" stroke="rgba(237,231,218,0.16)"/>
  <text x="165" y="277" text-anchor="middle" font-size="13.5" fill="#EDE7DA">dedup vs APP_STORE_REVIEWS</text>
</g>
<g>
  <rect x="30" y="322" width="270" height="44" rx="8" fill="#1A1714" stroke="rgba(237,231,218,0.16)"/>
  <text x="165" y="349" text-anchor="middle" font-size="13.5" fill="#EDE7DA">insert new iOS rows</text>
</g>

<g>
  <rect x="30" y="428" width="270" height="52" rx="8" fill="#1F1B16" stroke="rgba(237,231,218,0.22)"/>
  <text x="165" y="451" text-anchor="middle" font-size="13.5" font-weight="600" fill="#EDE7DA">Android · Google Play</text>
  <text x="165" y="469" text-anchor="middle" font-size="12" fill="#A39B8C">service JWT → OAuth token → API</text>
</g>
<g>
  <rect x="30" y="508" width="270" height="44" rx="8" fill="#1A1714" stroke="rgba(237,231,218,0.16)"/>
  <text x="165" y="535" text-anchor="middle" font-size="13.5" fill="#EDE7DA">classify + validate</text>
</g>
<g>
  <rect x="30" y="580" width="270" height="44" rx="8" fill="#1A1714" stroke="rgba(237,231,218,0.16)"/>
  <text x="165" y="607" text-anchor="middle" font-size="13.5" fill="#EDE7DA">dedup → insert new Android rows</text>
</g>

<!-- ===== right column: surveys ===== -->
<g>
  <rect x="380" y="26" width="270" height="44" rx="8" fill="rgba(198,249,78,0.09)" stroke="#C6F94E"/>
  <text x="515" y="53" text-anchor="middle" font-size="13.5" font-weight="600" fill="#C6F94E">Schedule · daily :40</text>
</g>
<g>
  <rect x="380" y="98" width="270" height="52" rx="8" fill="#1F1B16" stroke="rgba(237,231,218,0.22)"/>
  <text x="515" y="121" text-anchor="middle" font-size="13.5" font-weight="600" fill="#EDE7DA">Surveys · Usersnap</text>
  <text x="515" y="139" text-anchor="middle" font-size="12" fill="#A39B8C">HS256 JWT → fetch → drop email</text>
</g>
<g>
  <rect x="380" y="178" width="270" height="44" rx="8" fill="#1A1714" stroke="rgba(237,231,218,0.16)"/>
  <text x="515" y="205" text-anchor="middle" font-size="13.5" fill="#EDE7DA">classify + validate</text>
</g>
<g>
  <rect x="380" y="250" width="270" height="44" rx="8" fill="#1A1714" stroke="rgba(237,231,218,0.16)"/>
  <text x="515" y="277" text-anchor="middle" font-size="13.5" fill="#EDE7DA">dedup vs USERSNAP_FEEDBACK</text>
</g>
<g>
  <rect x="380" y="322" width="270" height="44" rx="8" fill="#1A1714" stroke="rgba(237,231,218,0.16)"/>
  <text x="515" y="349" text-anchor="middle" font-size="13.5" fill="#EDE7DA">insert new survey rows</text>
</g>

<!-- flow -->
<g stroke="#6A6357" stroke-width="1.5" fill="none" marker-end="url(#n2arrow)">
  <line x1="165" y1="70" x2="165" y2="94"/>
  <line x1="165" y1="150" x2="165" y2="174"/>
  <line x1="165" y1="222" x2="165" y2="246"/>
  <line x1="165" y1="294" x2="165" y2="318"/>
  <line x1="165" y1="480" x2="165" y2="504"/>
  <line x1="165" y1="552" x2="165" y2="576"/>
  <line x1="515" y1="70" x2="515" y2="94"/>
  <line x1="515" y1="150" x2="515" y2="174"/>
  <line x1="515" y1="222" x2="515" y2="246"/>
  <line x1="515" y1="294" x2="515" y2="318"/>
</g>

<!-- the accidental string -->
<line x1="165" y1="366" x2="165" y2="424" stroke="#D9603F" stroke-width="1.6" stroke-dasharray="5 4" fill="none" marker-end="url(#n2red)"/>
<text x="186" y="391" font-size="12" font-weight="600" fill="#D9603F">no trigger of its own</text>
<text x="186" y="408" font-size="11.5" fill="#A39B8C">both branches of the If feed it</text>

<line x1="30" y1="652" x2="650" y2="652" stroke="rgba(237,231,218,0.12)"/>
<text x="30" y="673" font-size="12" fill="#A39B8C">Android hangs off the end of iOS — so a failure in the iOS branch silently takes Android down with it.</text>
<text x="30" y="691" font-size="12" fill="#A39B8C">Not designed that way. Ended up that way, because the second branch started as "just carry on from here".</text>
</svg>
